<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusQuest - 遊戲化四象限記事</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <style>
        .task-completed { opacity: 0.5; text-decoration: line-through; }
        .task-postponed { border-style: dashed; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold text-indigo-400 flex items-center gap-2">
                <span>🛡️</span> FocusQuest
            </h1>
            <div class="flex items-center gap-4">
                <div class="bg-slate-800 px-3 py-1 rounded-full border border-slate-700 text-sm">
                    ⭐ 積分：<span id="user-points" class="font-bold text-amber-400">0</span> 點
                </div>
            </div>
        </div>
    </header>

    <!-- 分頁導航 -->
    <nav class="bg-slate-900/50 border-b border-slate-800/80">
        <div class="max-w-4xl mx-auto flex">
            <button onclick="switchTab('quadrants')" id="tab-quadrants" class="flex-1 py-3 text-center text-sm font-medium border-b-2 border-indigo-500 text-indigo-400">四象限記事</button>
            <button onclick="switchTab('backlog')" id="tab-backlog" class="flex-1 py-3 text-center text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200">
                逾期 Backlog (<span id="backlog-count">0</span>)
            </button>
            <button onclick="switchTab('store')" id="tab-store" class="flex-1 py-3 text-center text-sm font-medium border-b-2 border-transparent text-slate-400 hover:text-slate-200">獎勵商城</button>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="max-w-4xl mx-auto p-4 flex-1 w-full space-y-6">

        <!-- 區塊 1：四象限記事 -->
        <section id="section-quadrants" class="space-y-6">
            
            <!-- 日期篩選與表單切換 -->
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">檢視指定日期任務：</label>
                    <input type="date" id="date-filter" onchange="filterByDate(this.value)" class="bg-slate-800 border border-slate-700 text-slate-100 px-3 py-1.5 rounded text-sm">
                </div>
                <button onclick="resetDateFilter()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded border border-slate-700">顯示全部日期</button>
            </div>

            <!-- 新增/修改表單 -->
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
                <h3 id="form-title" class="text-sm font-bold text-slate-300 mb-3">+ 新增記事</h3>
                <form id="task-form" onsubmit="handleTaskSubmit(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="hidden" id="edit-task-id">
                    
                    <div class="sm:col-span-2">
                        <label class="block text-[10px] text-slate-400 mb-0.5">任務標題</label>
                        <input type="text" id="task-title" required placeholder="例如：會計練習題、背單字..." class="w-full border border-slate-700 bg-slate-800 text-slate-100 p-2 rounded text-sm">
                    </div>

                    <div>
                        <label class="block text-[10px] text-slate-400 mb-0.5">象限分類</label>
                        <select id="task-quadrant" class="w-full border border-slate-700 bg-slate-800 text-slate-100 p-2 rounded text-sm">
                            <option value="q1">Q1：重要且緊急 (立刻做)</option>
                            <option value="q2" selected>Q2：重要但不緊急 (排計畫)</option>
                            <option value="q3">Q3：不重要但緊急 (授權/快做)</option>
                            <option value="q4">Q4：不重要且不緊急 (有空再說)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] text-slate-400 mb-0.5">獎勵點數</label>
                        <input type="number" id="task-points" value="15" min="0" class="w-full border border-slate-700 bg-slate-800 text-slate-100 p-2 rounded text-sm">
                    </div>

                    <!-- 起訖日期區間 -->
                    <div class="grid grid-cols-2 gap-2 sm:col-span-1">
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-0.5">開始日期</label>
                            <input type="date" id="task-start-date" required class="w-full border border-slate-700 bg-slate-800 text-slate-100 p-2 rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-0.5">結束期限</label>
                            <input type="date" id="task-end-date" required class="w-full border border-slate-700 bg-slate-800 text-slate-100 p-2 rounded text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] text-slate-400 mb-0.5">重複頻率</label>
                        <select id="task-repeat" class="w-full border border-slate-700 bg-slate-800 text-slate-100 p-2 rounded text-sm">
                            <option value="none">不重複</option>
                            <option value="daily">每天重複</option>
                            <option value="weekly">每周重複</option>
                        </select>
                    </div>

                    <div class="sm:col-span-2">
                        <label class="block text-[10px] text-slate-400 mb-0.5">備註說明 (選填)</label>
                        <textarea id="task-note" rows="2" placeholder="詳細內容或題數..." class="w-full border border-slate-700 bg-slate-800 text-slate-100 p-2 rounded text-sm"></textarea>
                    </div>

                    <div class="sm:col-span-2 flex justify-end gap-2">
                        <button type="button" id="task-cancel-btn" onclick="resetTaskForm()" class="hidden bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded text-sm">取消</button>
                        <button type="submit" id="task-submit-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded text-sm font-medium">建立記事</button>
                    </div>
                </form>
            </div>

            <!-- 四象限九宮格檢視 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Q1 -->
                <div class="bg-slate-900 border border-red-950/60 p-4 rounded-xl shadow-lg flex flex-col">
                    <div class="flex justify-between items-center mb-3 border-b border-red-950 pb-2">
                        <h3 class="font-bold text-red-400 text-sm">🔥 Q1：重要且緊急</h3>
                        <span class="text-xs text-slate-500">立即行動</span>
                    </div>
                    <div id="list-q1" class="space-y-2 flex-1"></div>
                </div>
                <!-- Q2 -->
                <div class="bg-slate-900 border border-indigo-950/60 p-4 rounded-xl shadow-lg flex flex-col">
                    <div class="flex justify-between items-center mb-3 border-b border-indigo-950 pb-2">
                        <h3 class="font-bold text-indigo-400 text-sm">💡 Q2：重要但不緊急</h3>
                        <span class="text-xs text-slate-500">長遠規劃</span>
                    </div>
                    <div id="list-q2" class="space-y-2 flex-1"></div>
                </div>
                <!-- Q3 -->
                <div class="bg-slate-900 border border-amber-950/60 p-4 rounded-xl shadow-lg flex flex-col">
                    <div class="flex justify-between items-center mb-3 border-b border-amber-950 pb-2">
                        <h3 class="font-bold text-amber-400 text-sm">⚡ Q3：不重要但緊急</h3>
                        <span class="text-xs text-slate-500">減少干擾</span>
                    </div>
                    <div id="list-q3" class="space-y-2 flex-1"></div>
                </div>
                <!-- Q4 -->
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg flex flex-col">
                    <div class="flex justify-between items-center mb-3 border-b border-slate-800 pb-2">
                        <h3 class="font-bold text-slate-400 text-sm">☕ Q4：不重要且不緊急</h3>
                        <span class="text-xs text-slate-500">放鬆休閒</span>
                    </div>
                    <div id="list-q4" class="space-y-2 flex-1"></div>
                </div>
            </div>
        </section>

        <!-- 區塊 2：逾期 Backlog -->
        <section id="section-backlog" class="hidden space-y-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
                <h3 class="font-bold text-amber-400 text-sm mb-1">⏳ 逾期未完成清單 (Backlog)</h3>
                <p class="text-xs text-slate-400 mb-4">超過期限未完成的任務會在此顯示，每日會自動折舊扣減 5 點，趕快把它們清掉吧！</p>
                <div id="backlog-list" class="space-y-3"></div>
            </div>
        </section>

        <!-- 區塊 3：獎勵商城 -->
        <section id="section-store" class="hidden space-y-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl shadow-lg">
                <h3 class="font-bold text-emerald-400 text-sm mb-1">🎁 獎勵兌換商城</h3>
                <p class="text-xs text-slate-400 mb-4">用你的自律點數來解鎖專屬小確幸！</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="store-items-list">
                    <!-- 動態載入商城項目 -->
                </div>
            </div>
        </section>

    </main>

    <script>
        let tasks = JSON.parse(localStorage.getItem('focusquest_tasks')) || [];
        let userPoints = parseInt(localStorage.getItem('focusquest_points')) || 0;
        let selectedDateFilter = "";

        const storeItems = [
            { id: 1, name: "普通 Oreo 冰炫風", points: 50, desc: "經典口味，讀書寫程式的最佳精神糧食" },
            { id: 2, name: "雙倍 Oreo 冰炫風", points: 70, desc: "加量升級版，給努力一整天的自己" },
            { id: 3, name: "7-11 飲料任選", points: 35, desc: "鋁箔包、茶飲或想喝的超商飲料" },
            { id: 4, name: "60元內手搖飲任選", points: 50, desc: "飲料店的美味飲品，輕鬆解饞" }
        ];

        function getTodayString() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        window.onload = function() {
            const today = getTodayString();
            document.getElementById('task-start-date').value = today;
            document.getElementById('task-end-date').value = today;
            renderAll();
        };

        function switchTab(tabName) {
            ['quadrants', 'backlog', 'store'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('border-indigo-500', 'text-indigo-400');
                document.getElementById(`tab-${t}`).classList.add('border-transparent', 'text-slate-400');
            });
            document.getElementById(`section-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.add('border-indigo-500', 'text-indigo-400');
            document.getElementById(`tab-${tabName}`).classList.remove('border-transparent', 'text-slate-400');
            if(tabName === 'backlog') renderBacklog();
            if(tabName === 'store') renderStore();
        }

        function filterByDate(dateStr) {
            selectedDateFilter = dateStr;
            renderTasks();
        }

        function resetDateFilter() {
            selectedDateFilter = "";
            document.getElementById('date-filter').value = "";
            renderTasks();
        }

        function handleTaskSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-task-id').value;
            const title = document.getElementById('task-title').value;
            const quadrant = document.getElementById('task-quadrant').value;
            const startDate = document.getElementById('task-start-date').value || getTodayString();
            const endDate = document.getElementById('task-end-date').value || startDate;
            const repeat = document.getElementById('task-repeat').value;
            const points = parseInt(document.getElementById('task-points').value) || 0;
            const note = document.getElementById('task-note').value;

            if (editId) {
                const task = tasks.find(t => t.id == editId);
                if (task) {
                    task.title = title;
                    task.quadrant = quadrant;
                    task.startDate = startDate;
                    task.endDate = endDate;
                    task.repeat = repeat;
                    task.points = points;
                    task.note = note;
                }
            } else {
                const newTask = {
                    id: Date.now(),
                    title, quadrant, startDate, endDate, repeat, points, note,
                    clickState: 0
                };
                tasks.push(newTask);
            }

            saveAndRefresh();
            resetTaskForm();
        }

        function resetTaskForm() {
            document.getElementById('task-form').reset();
            document.getElementById('edit-task-id').value = "";
            document.getElementById('form-title').innerText = "+ 新增記事";
            document.getElementById('task-submit-btn').innerText = "建立記事";
            document.getElementById('task-cancel-btn').classList.add('hidden');
            document.getElementById('task-start-date').value = getTodayString();
            document.getElementById('task-end-date').value = getTodayString();
        }

        function editTask(id) {
            const task = tasks.find(t => t.id == id);
            if (!task) return;

            document.getElementById('edit-task-id').value = task.id;
            document.getElementById('task-title').value = task.title;
            document.getElementById('task-quadrant').value = task.quadrant;
            document.getElementById('task-start-date').value = task.startDate || task.date;
            document.getElementById('task-end-date').value = task.endDate || task.date;
            document.getElementById('task-repeat').value = task.repeat;
            document.getElementById('task-points').value = task.points;
            document.getElementById('task-note').value = task.note;

            document.getElementById('form-title').innerText = "✎ 修改記事";
            document.getElementById('task-submit-btn').innerText = "儲存修改";
            document.getElementById('task-cancel-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id != id);
            saveAndRefresh();
        }

        function handleTaskClick(id) {
            const task = tasks.find(t => t.id == id);
            if (!task) return;

            if (task.clickState === 0) {
                task.clickState = 1; // 完成
                userPoints += task.points;
            } else if (task.clickState === 1) {
                task.clickState = 2; // 延後
                userPoints -= task.points;
            } else {
                task.clickState = 0; // 恢復正常
            }
            saveAndRefresh();
        }

        function completeBacklogTask(id, decayedPoints) {
            const task = tasks.find(t => t.id == id);
            if (!task) return;
            task.clickState = 1;
            userPoints += decayedPoints;
            saveAndRefresh();
        }

        function buyReward(itemId) {
            const item = storeItems.find(i => i.id == itemId);
            if (!item) return;
            if (userPoints < item.points) {
                alert("點數不足，再加把勁完成任務吧！");
                return;
            }
            if (confirm(`確定要花費 ${item.points} 點兌換「${item.name}」嗎？`)) {
                userPoints -= item.points;
                saveAndRefresh();
                alert(`成功兌換 ${item.name}！好好享用吧！`);
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('focusquest_tasks', JSON.stringify(tasks));
            localStorage.setItem('focusquest_points', userPoints);
            renderAll();
        }

        function renderAll() {
            document.getElementById('user-points').innerText = userPoints;
            renderTasks();
            renderBacklogCount();
        }

        function renderTasks() {
            ['q1', 'q2', 'q3', 'q4'].forEach(q => {
                document.getElementById(`list-${q}`).innerHTML = '';
            });

            tasks.forEach(task => {
                const sDate = task.startDate || task.date;
                const eDate = task.endDate || task.date;

                if (selectedDateFilter) {
                    if (selectedDateFilter < sDate || selectedDateFilter > eDate) return;
                }

                const container = document.getElementById(`list-${task.quadrant}`);
                if (!container) return;

                let cardClass = "bg-slate-800/80 border border-slate-700 p-3 rounded-lg shadow-sm flex flex-col justify-between transition select-none ";
                if (task.clickState === 1) cardClass += "task-completed";
                else if (task.clickState === 2) cardClass += "task-postponed";

                let html = `
                    <div class="${cardClass}">
                        <div onclick="handleTaskClick(${task.id})" class="cursor-pointer">
                            <div class="flex justify-between items-start">
                                <span class="font-semibold text-sm text-slate-200">${escapeHtml(task.title)}</span>
                                <span class="text-xs bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-0.5 rounded">+${task.points}點</span>
                            </div>
                            ${task.note ? `<p class="text-xs text-slate-400 mt-1">${escapeHtml(task.note)}</p>` : ''}
                            <div class="flex justify-between items-center mt-2 text-[10px] text-slate-400">
                                <span>📅 ${sDate} ~ ${eDate}</span>
                                <span>狀態: ${task.clickState === 1 ? '已完成' : task.clickState === 2 ? '已延後' : '進行中'}</span>
                            </div>
                        </div>
                        <div class="flex justify-end gap-2 mt-2 pt-2 border-t border-slate-700/50">
                            <button onclick="editTask(${task.id})" class="text-xs text-indigo-400 hover:underline">修改</button>
                            <button onclick="deleteTask(${task.id})" class="text-xs text-red-400 hover:underline">刪除</button>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function renderBacklogCount() {
            const todayStr = getTodayString();
            const backlogTasks = tasks.filter(t => {
                const eDate = t.endDate || t.date;
                return eDate < todayStr && t.clickState !== 1;
            });
            document.getElementById('backlog-count').innerText = backlogTasks.length;
        }

        function renderBacklog() {
            const backlogList = document.getElementById('backlog-list');
            backlogList.innerHTML = '';
            const todayStr = getTodayString();

            const backlogTasks = tasks.filter(t => {
                const eDate = t.endDate || t.date;
                return eDate < todayStr && t.clickState !== 1;
            });

            if (backlogTasks.length === 0) {
                backlogList.innerHTML = `<p class="text-slate-500 text-sm text-center py-6">太棒了！沒有逾期未完成的記事。</p>`;
                return;
            }

            backlogTasks.forEach(task => {
                const eDate = task.endDate || task.date;
                const diffTime = new Date(todayStr) - new Date(eDate);
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                let decayedPoints = Math.max(0, task.points - (diffDays * 5));

                backlogList.innerHTML += `
                    <div class="bg-amber-950/30 border border-amber-900/50 p-3 rounded-lg flex justify-between items-center">
                        <div>
                            <h4 class="font-semibold text-sm text-slate-200">${escapeHtml(task.title)}</h4>
                            <p class="text-xs text-slate-400">期限: ${task.startDate || task.date} ~ ${eDate} (逾期 ${diffDays} 天) | 點數: <span class="text-amber-400 font-bold">${decayedPoints} 點</span></p>
                        </div>
                        <div class="space-x-2">
                            <button onclick="completeBacklogTask(${task.id}, ${decayedPoints})" class="bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-1 rounded text-xs">補完成</button>
                            <button onclick="deleteTask(${task.id})" class="bg-red-950 text-red-300 border border-red-900 px-3 py-1 rounded text-xs">刪除</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderStore() {
            const storeList = document.getElementById('store-items-list');
            storeList.innerHTML = '';
            storeItems.forEach(item => {
                storeList.innerHTML += `
                    <div class="bg-slate-800/60 border border-slate-700 p-3 rounded-xl flex justify-between items-center">
                        <div>
                            <h4 class="font-semibold text-sm text-slate-200">${item.name}</h4>
                            <p class="text-xs text-slate-400 mt-0.5">${item.desc}</p>
                            <span class="inline-block mt-2 text-xs font-bold text-amber-400">${item.points} 點</span>
                        </div>
                        <button onclick="buyReward(${item.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded text-xs font-medium">兌換</button>
                    </div>
                `;
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
